name: Live Title
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - run: python gh_title.py
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
